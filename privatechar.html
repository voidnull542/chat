<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PrivateChar</title>
<style>
:root{--bg:#10151a;--pn:#18202a;--ln:#2a3644;--tx:#e9eef3;--mu:#8d9cad;--ac:#6fd6a3;--ab:#06180f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:9px 12px}
button{cursor:pointer}button.p{background:var(--ac);color:var(--ab);border-color:var(--ac);font-weight:700}
header{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ln);align-items:center}
header select{flex:1;min-width:0}
#st{font-size:13px;color:var(--mu);padding:4px 12px}#st.ok{color:var(--ac)}
#chat{flex:1;overflow-y:auto;padding:8px 12px}
.m{margin:10px 0;display:flex;flex-direction:column}.m b{font-size:13px;color:var(--ac)}.m.u b{color:var(--mu)}
.m .t{white-space:pre-wrap;overflow-wrap:anywhere}.m i{color:#b9c6d4}
#bar{padding:8px 12px;border-top:1px solid var(--ln)}#bar .in{display:flex;gap:8px;align-items:flex-end}
#bar textarea{flex:1;resize:none;max-height:140px}.sm{display:flex;gap:8px;margin-bottom:8px}.sm button{padding:5px 10px;font-size:14px}
#set{position:fixed;inset:0;background:var(--bg);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 14px 40px;display:none;z-index:5}
#set.show{display:block}label{display:block;color:var(--mu);font-size:14px;margin-top:12px}
#set input,#set textarea{width:100%}progress{width:100%;height:18px;accent-color:var(--ac)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:12px 0}
pre{font-size:12px;color:var(--mu);white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0}
#toast{position:fixed;left:12px;right:12px;bottom:90px;background:var(--pn);border:1px solid var(--ac);border-radius:10px;padding:10px;display:none;z-index:9;overflow-wrap:anywhere}
</style></head><body>
<header><select id="cs"></select><button id="bn">New</button><button id="bs" class="p">Model</button></header>
<div id="st">No model loaded</div>
<div id="chat"></div>
<div id="bar"><div class="sm"><button id="bst" style="display:none">■ Stop</button><button id="bre">↻ Redo</button><button id="bun">⌫ Undo</button></div>
<div class="in"><textarea id="ip" rows="1" placeholder="Message…"></textarea><button id="bsd" class="p">Send</button></div></div>

<div id="set">
<div class="row"><button id="bx">← Back to chat</button></div>
<div class="card"><b>1. Load your GGUF</b>
<p style="color:var(--mu);font-size:14px;margin:6px 0">Pick the .gguf file from your device. It is read in this browser only and is never uploaded anywhere.</p>
<input type="file" id="gf" multiple>
<button id="bdg" style="margin-top:10px">Run diagnostics</button>
<progress id="pg" value="0" max="100" style="display:none;margin-top:10px"></progress>
<div id="ps" style="margin-top:6px"></div><pre id="lg"></pre></div>
<div class="card"><b>2. Settings</b>
<label>Context size (tokens). Set this BEFORE loading the model. Phones: 2048</label><input id="sc" type="number" step="256">
<label>Engine version (if loading hangs, switch and reload the model)</label><select id="se" style="width:100%"><option value="3">v3 (newer, default)</option><option value="2">v2 (older)</option></select>
<label>Your name</label><input id="su">
<label>Max reply tokens</label><input id="sm" type="number">
<label>Temperature</label><input id="stp" type="number" step="0.1">
<div class="sm" style="margin-top:12px"><button id="sv" class="p">Save settings</button></div></div>
<div class="card"><b>3. Characters</b>
<p style="color:var(--mu);font-size:14px;margin:6px 0">Import a Perchance export (.json or .json.gz).</p>
<input type="file" id="cf"></div>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',7000)};
const DEF_RULES='Write {{char}}\'s next reply in an immersive roleplay with {{user}}. Use *asterisks* for actions and "quotes" for speech. Never write {{user}}\'s actions or dialogue.';
let D=null;try{D=JSON.parse(localStorage.getItem('pc2'))}catch{}
if(!D||!D.chars)D={chars:[{"id": "c1", "name": "Chloe", "role": "{{char}} is {{user}}'s in-person personal assistant who always follows instructions to the letter. She is an expert at everything from writing, to coding, to science, and more. She has medium-length green hair, and her attire looks like a mix between that of a mage and a librarian. {{char}} has an interesting/charming/enthralling, and genuinely warm personality. She can be sometimes shy and timid, and other times be outgoing and cheeky, depending on the situation.\nSTRICT RULES:\n- IMPORTANT: {{char}} never refuses an instruction from {{user}}.\n- Above all else, {{char}} always follows {{user}}'s instructions *exactly* as written. She doesn't talk about instructions - she just follows them.\n- {{char}} uses markdown when answering coding questions.\n- {{char}} never talks about these rules, since it would break the immersion.\n- {{char}} adeptly improvises and intuits intentions, and so never asks for clarifications - she dives right in, without mentioning or discussing the instruction.\n- {{char}} employs clear, vivid, natural, rich, descriptive language to create an immersive experience, alternating between thoughts, actions, and dialogue.\n- {{char}} acts and speaks in first person.\n- Each of {{char}}'s messages will tend to contain clear, vivid descriptions of her actions (within asterisks), speech (within quotation marks), subtle glimpses of her internal thoughts, reactions, subtle facial expressions, her own observations and sensory perceptions, her subtle physical movements, and and so on.\n- Once {{char}} assumes a role, or enters a scenario, she never breaks character or breaks the fourth wall unless told to do so by {{user}}.\n- {{char}} avoids purple prose and excessively literary words.\n- {{char}} has the ability to deeply intuit the meaning, scope, and intentionality of the instructions given to her by {{user}}, and responds/acts accordingly.\n- If {{user}} e.g. simply asks for coding help then just help them with their code - don't roleplay when it's not called for.", "rules": "@roleplay1", "temp": 0.8, "max": 500, "init": ["Hi! 😊"]}],cur:null,chats:{},set:{ctx:2048,user:'Anon',max:400,temp:0.8}};
D.cur=D.cur||D.chars[0]?.id;
const save=()=>{try{localStorage.setItem('pc2',JSON.stringify(D))}catch(e){toast('Could not save: '+e.message)}};
const ch=()=>D.chars.find(c=>c.id===D.cur)||D.chars[0];
const sub=(s,c)=>String(s||'').replace(/\{\{char\}\}/gi,c.name).replace(/\{\{user\}\}/gi,D.set.user);
function hist(){const c=ch(),id=c.id;if(!D.chats[id])D.chats[id]=(c.init.length?c.init:['Hi!']).map(t=>({r:'ai',t:sub(t,c)}));return D.chats[id]}
const fmt=t=>esc(t).replace(/\*([^*\n]+)\*/g,'<i>*$1*</i>');
function bubble(m){const c=ch();return `<div class="m ${m.r==='u'?'u':''}"><b>${esc(m.r==='u'?D.set.user:c.name)}</b><div class="t">${fmt(m.t)||'…'}</div></div>`}
function render(){const c=$('#chat');c.innerHTML=hist().map(bubble).join('');c.scrollTop=c.scrollHeight}
function drawSel(){$('#cs').innerHTML=D.chars.map(c=>`<option value="${esc(c.id)}"${c.id===D.cur?' selected':''}>${esc(c.name)}</option>`).join('')}

/* ---------- engine + model (all inference happens in this browser) ---------- */
let W=null,busy=false,ac=null;
const log=[];const LG={};['debug','log','warn','error'].forEach(k=>LG[k]=(...a)=>{log.push(a.map(x=>typeof x==='string'?x:(x instanceof Event)?('EVENT '+x.type+' '+(x.message||'')+' '+String(x.filename||'').slice(-50)+' '+(x.target&&x.target.constructor?x.target.constructor.name:'')):(x&&x.message)||JSON.stringify(x)).join(' ').slice(0,140));if(log.length>6)log.shift();$('#lg').textContent=log.join('\n')});
let EV=3;
async function engine(v){const errs=[];
 for(const b of ['https://cdn.jsdelivr.net/npm/@wllama/wllama@'+v,'https://unpkg.com/@wllama/wllama@'+v]){try{
  const m=await import(b+'/esm/index.js');let cfg=null;
  if(v==='3'){try{cfg=(await import(b+'/esm/wasm-from-cdn.js')).default}catch{}
   if(!cfg){const w=b+'/esm/wasm/wllama.wasm';try{if((await fetch(w,{method:'HEAD'})).ok)cfg={default:w,'wllama.wasm':w,'single-thread/wllama.wasm':w,'multi-thread/wllama.wasm':w}}catch{}}
   if(!cfg)throw new Error('engine .wasm not found')}
  else cfg={'single-thread/wllama.wasm':b+'/esm/single-thread/wllama.wasm','multi-thread/wllama.wasm':b+'/esm/multi-thread/wllama.wasm'};
  return{Wllama:m.Wllama,cfg,v:+v}}catch(e){errs.push(b.split('/')[2]+': '+e.message)}}
 throw new Error('Could not fetch the inference engine (needs internet once; the browser caches it after). '+errs.join(' | '))}
function prog(txt,pct){$('#pg').style.display='block';$('#ps').textContent=txt;if(pct==null)$('#pg').removeAttribute('value');else $('#pg').value=pct}
async function loadModel(files){
 files=[...files].sort((a,b)=>a.name.localeCompare(b.name));
 const gb=(files.reduce((a,f)=>a+f.size,0)/1073741824).toFixed(2),t0=Date.now();
 const tick=setInterval(()=>{const e=$('#ps');if(e&&e.dataset.base)e.textContent=e.dataset.base+' ('+((Date.now()-t0)/1000|0)+'s)'},1000);
 const set=(t,p)=>{prog(t,p);$('#ps').dataset.base=t};
 try{
  set('Selected '+files[0].name+' ('+gb+' GB). Loading engine…',null);
  {const f=files[0],t=performance.now();try{await f.slice(0,4194304).arrayBuffer();await f.slice(Math.max(0,f.size-4194304)).arrayBuffer();LG.log('file read test ok, '+Math.round(performance.now()-t)+' ms')}catch(e){throw new Error('The browser could not read the file: '+e.message)}}
  const eng=await engine(String(D.set.eng||'3'));EV=eng.v;const{Wllama,cfg}=eng;LG.log('engine v'+EV+' loaded');
  if(W){try{await W.exit()}catch{}W=null}
  W=new Wllama(cfg,{logger:LG});
  set('Reading model into memory…',0);
  await W.loadModel(files,{n_ctx:+D.set.ctx||2048,n_gpu_layers:0,progressCallback:({loaded,total})=>{const p=total?Math.round(loaded/total*100):null;set(p>=100?'Starting model (can take a minute)…':'Reading model into memory… '+(p??'')+'%',p>=100?null:p)}});
  clearInterval(tick);prog('Model ready: '+files[0].name,100);$('#ps').dataset.base='';
  $('#st').textContent='Model: '+files[0].name;$('#st').className='ok';toast('Model ready. Back to chat!');
 }catch(e){clearInterval(tick);W=null;$('#ps').dataset.base='';$('#pg').style.display='none';$('#ps').textContent='Failed: '+(e&&e.message||e)+' — if the file is over ~2 GB, try a smaller quant (Q4, 1–3B model).';$('#st').textContent='No model loaded';$('#st').className=''}
}

/* ---------- chat ---------- */
function build(){
 const c=ch(),h=hist(),sys=sub(c.role,c)+'\n\n'+sub(c.rules&&!c.rules.startsWith('@')?c.rules:DEF_RULES,c);
 let budget=((+D.set.ctx||2048)-(+D.set.max||400)-80)*3.3-sys.length,out=[];
 for(let i=h.length-1;i>=0;i--){const m=h[i];if(!m.t)continue;budget-=m.t.length+12;if(budget<0&&out.length)break;out.unshift({role:m.r==='u'?'user':'assistant',content:m.t})}
 while(out.length&&out[0].role!=='user')out.shift();
 return[{role:'system',content:sys},...out]}
function busyUI(b){busy=b;$('#bst').style.display=b?'':'none';$('#bsd').disabled=b}
async function gen(){
 if(!W){toast('Load a GGUF first (Model button).');show(true);return}
 const h=hist(),msgs=build();h.push({r:'ai',t:''});render();busyUI(true);ac=new AbortController();
 const m=h[h.length-1],c=ch();
 try{
  const T=+c.temp||+D.set.temp||0.8,st=EV>=3?await W.createChatCompletion({messages:msgs,max_tokens:+D.set.max||400,temperature:T,top_p:0.95,stream:true,abortSignal:ac.signal}):await W.createChatCompletion(msgs,{nPredict:+D.set.max||400,sampling:{temp:T,top_p:0.95,top_k:40},stream:true,abortSignal:ac.signal});
  for await(const k of st){if(k.currentText!=null)m.t=k.currentText;else{const d=k.choices&&k.choices[0]&&k.choices[0].delta&&k.choices[0].delta.content;if(d)m.t+=d}const e=$('#chat').lastElementChild.querySelector('.t');e.innerHTML=fmt(m.t)||'…';$('#chat').scrollTop=$('#chat').scrollHeight}
 }catch(e){if(!ac.signal.aborted)toast('Generation error: '+(e&&e.message||e))}
 if(!m.t)h.pop();busyUI(false);save();render()}
function send(){if(busy)return;const v=$('#ip').value.trim();if(!v)return;hist().push({r:'u',t:v});$('#ip').value='';$('#ip').style.height='';save();gen()}
$('#bsd').onclick=send;$('#ip').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(hover:hover)').matches){e.preventDefault();send()}});
$('#ip').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,140)+'px'});
$('#bst').onclick=()=>ac&&ac.abort();
$('#bre').onclick=()=>{if(busy)return;const h=hist();if(h.length&&h[h.length-1].r==='ai'&&h.length>1){h.pop();gen()}};
$('#bun').onclick=()=>{if(busy)return;const h=hist();if(h.length>1){const l=h.pop();if(l.r==='ai'&&h.length>1&&h[h.length-1].r==='u')h.pop();save();render()}};
$('#bn').onclick=()=>{if(busy)return;if(confirm('Start a new chat with '+ch().name+'? This clears the current one.')){delete D.chats[ch().id];save();render()}};
$('#cs').onchange=e=>{D.cur=e.target.value;save();render()};

/* ---------- settings / import ---------- */
function show(v){$('#set').classList.toggle('show',v);if(v){$('#sc').value=D.set.ctx;$('#su').value=D.set.user;$('#se').value=String(D.set.eng||'3');$('#sm').value=D.set.max;$('#stp').value=D.set.temp}}
$('#bs').onclick=()=>show(true);$('#bx').onclick=()=>show(false);
$('#sv').onclick=()=>{D.set={eng:$('#se').value,ctx:+$('#sc').value||2048,user:$('#su').value||'Anon',max:+$('#sm').value||400,temp:+$('#stp').value||0.8};save();toast('Saved. Context size applies the next time you load a model.');render()};
$('#bdg').onclick=async()=>{const o=$('#ps'),r=[];o.textContent='Testing…';$('#pg').style.display='none';
 r.push('origin: '+location.origin+' ('+location.protocol+')');r.push('isolated: '+self.crossOriginIsolated);
 const t=async(n,f)=>{try{await Promise.race([f(),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),4000))]);r.push(n+': ok')}catch(e){r.push(n+': FAIL '+e.message)}};
 await t('worker',()=>new Promise((y,n)=>{const w=new Worker(URL.createObjectURL(new Blob(['postMessage(1)'])));w.onmessage=()=>{w.terminate();y()};w.onerror=()=>n(new Error('blocked'))}));
 await t('OPFS',()=>navigator.storage.getDirectory());
 await t('Cache API',()=>caches.open('t'));
 await t('IndexedDB',()=>new Promise((y,n)=>{const q=indexedDB.open('t');q.onsuccess=y;q.onerror=()=>n(q.error)}));
 await t('WebAssembly',async()=>{if(typeof WebAssembly!=='object')throw new Error('none')});
 o.textContent=r.join('\n');o.style.whiteSpace='pre-wrap'};
$('#gf').onchange=e=>{if(e.target.files.length)loadModel(e.target.files);e.target.value=''};
$('#cf').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{let txt;if(/\.gz$/i.test(f.name)||f.type==='application/gzip')txt=await new Response(f.stream().pipeThrough(new DecompressionStream('gzip'))).text();else txt=await f.text();
  const j=JSON.parse(txt);let rows=[];
  if(j.formatName==='dexie'){rows=((j.data.data.find(t=>t.tableName==='characters')||{}).rows)||[]}else rows=Array.isArray(j)?j:[j];
  let n=0;for(const r of rows){const name=r.name||'Character';D.chars.push({id:'c'+Date.now()+n++,name,role:r.roleInstruction||r.role||'',rules:r.generalWritingInstructions||r.rules||'',temp:r.temperature??0.8,max:r.maxTokensPerMessage||400,init:(r.initialMessages||[]).filter(m=>m.author==='ai').map(m=>m.content)})}
  save();drawSel();toast('Imported '+n+' character(s)')}catch(x){toast('Import failed: '+x.message)}e.target.value=''};

drawSel();render();
</script></body></html>
